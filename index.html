<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mantenimiento 360 – Prototipo</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F8;--card:#FFFFFF;--ink:#0F1F3D;--mute:#53607A;--navy:#0B1B3A;--gold:#C9A227;--gd:#8A6508;--line:#DCE2EC;--soft:#EAEEF6;--ok:#1E7F5C;--bad:#B3261E;--bar:#0B1B3A;--btn:#0B1B3A;--btnt:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081329;--card:#102446;--ink:#EEF1F7;--mute:#A9B4CA;--gd:#E3C15A;--line:#24406E;--soft:#17305C;--ok:#52C79A;--bad:#FF8A80;--bar:#7FA0DA;--btn:#C9A227;--btnt:#0B1B3A}}
:root[data-theme="dark"]{--bg:#081329;--card:#102446;--ink:#EEF1F7;--mute:#A9B4CA;--gd:#E3C15A;--line:#24406E;--soft:#17305C;--ok:#52C79A;--bad:#FF8A80;--bar:#7FA0DA;--btn:#C9A227;--btnt:#0B1B3A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--navy);color:#fff}
.brand{font-weight:800;font-size:22px;letter-spacing:1px}.brand b{color:var(--gold)}.lg b{color:var(--gd)}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:10px}
.seg button{border:0;background:none;color:#fff;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--navy)}
.web{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 66px)}
nav{background:var(--navy);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
nav .user{color:#fff;padding:6px 14px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px}nav small{color:#C9D3E8}
nav button{display:flex;gap:10px;align-items:center;text-align:left;color:#C9D3E8;background:none;border:0;padding:11px 14px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:rgba(201,162,39,.2);color:#fff;box-shadow:inset 3px 0 var(--gold)}
.main{padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
h2{margin:0;font-size:28px}.sub{color:var(--mute);margin:2px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi{border-top:4px solid var(--gold)}.kpi b{font-size:36px;display:block}.kpi span{color:var(--mute)}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--mute);font-weight:600}
.bd{padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700;background:var(--soft);white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.gd{color:var(--gd)}
.btn{background:var(--btn);color:var(--btnt);border:0;padding:11px 18px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--gold);color:#0B1B3A}
select,input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.al,.ckr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ckr select{width:160px}
.pb{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--gold)}
.dt{display:inline-block;min-width:56px;text-align:center;background:var(--navy);color:#fff;border-radius:8px;padding:4px 8px;font-weight:700;margin-right:10px}
.cal div{padding:8px 0;border-bottom:1px solid var(--line)}
.qrw{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.ph{width:min(360px,calc(100% - 24px));height:720px;margin:24px auto;border:10px solid #0B1B3A;border-radius:38px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.ph .scr{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ph h3{margin:0}.mc{text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.tb{display:flex;background:var(--navy)}
.tb button{flex:1;background:none;border:0;color:#C9D3E8;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:12px;cursor:pointer}.tb .on{color:var(--gold)}
.scan{border:3px dashed var(--gold);border-radius:16px;padding:36px 16px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--navy);color:#fff;border-left:5px solid var(--gold);padding:12px 18px;border-radius:10px;z-index:9}
@media(max-width:820px){.web{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto}nav .user{display:none}.g2{grid-template-columns:1fr}}
body{-webkit-font-smoothing:antialiased;line-height:1.4}
.top{background:linear-gradient(90deg,#08142E,#0F2A5C);border-bottom:3px solid var(--gold);padding:10px 24px}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;letter-spacing:.3px}.mk svg{display:block;width:34px;height:34px}
nav{background:linear-gradient(180deg,#0B1B3A,#0F2A5C);gap:2px;box-shadow:2px 0 12px rgba(0,0,0,.15)}
nav button{font-weight:600;transition:.15s}nav button:hover{background:rgba(255,255,255,.07);color:#fff}nav button.on svg{color:var(--gold)}
.main{padding:24px 32px 40px;gap:20px;max-width:1280px;width:100%;box-sizing:border-box}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.crumb{color:var(--mute)}.crumb b{color:var(--ink)}
.tools{display:flex;gap:14px;align-items:center}.tools input{width:min(240px,100%);border-radius:20px}
.bell{position:relative;display:flex;color:var(--mute)}.bell i{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--gold)}
h2{font-size:30px;font-weight:800;letter-spacing:-.3px}
.card{box-shadow:0 1px 2px rgba(11,27,58,.06),0 6px 18px rgba(11,27,58,.06);border-radius:14px}
.kpi{position:relative;display:flex;flex-direction:column;gap:2px}.kpi b{font-size:38px;line-height:1.1}.kic{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--gd);display:flex;align-items:center;justify-content:center}
th{font-size:12px;text-transform:uppercase;letter-spacing:.8px}tr:hover td{background:var(--soft)}
.bd.ok,.bd.bad,.bd.gd{background:color-mix(in srgb,currentColor 14%,transparent)}.bd::before{content:"● ";font-size:9px}
.btn{box-shadow:0 2px 6px rgba(11,27,58,.2);transition:.15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.sb{background:var(--navy);color:#fff;display:flex;justify-content:space-between;padding:8px 22px;font-size:13px;font-weight:700}
.login{justify-content:center;text-align:center;background:linear-gradient(180deg,var(--card),var(--bg))}.login .brand{justify-content:center}.lgm{align-self:center}.lgm svg{width:76px;height:76px}
.ph{box-shadow:0 20px 50px rgba(11,27,58,.35)}.ph.ios{border-radius:46px}.ph.tab{width:min(560px,calc(100% - 24px));height:760px}.nt{width:90px;height:22px;background:#000;border-radius:12px}
.cont{display:flex;flex-direction:column;gap:20px}.bell i.n{width:auto;min-width:16px;height:16px;border-radius:8px;color:#fff;font-size:11px;font-weight:700;font-style:normal;text-align:center;line-height:16px;top:-9px;right:-11px}
.ov{position:fixed;inset:0;background:rgba(8,19,41,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.cap{text-align:center;color:var(--mute);margin:-12px 0 24px}
</style></head><body>
<div class="top" id="top"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const M=[["CAM-012","Camión minero 930E","Komatsu 930E",18420,"Operativa"],["CAR-004","Cargador frontal 994F","Caterpillar 994F",21350,"Operativa"],["EXC-007","Excavadora hidráulica PC5500","Komatsu PC5500",15780,"En mantenimiento"],["TRA-003","Tractor de orugas D10T","Caterpillar D10T",24110,"Operativa"],["PER-002","Perforadora DR410","Sandvik DR410",9650,"Fuera de servicio"],["CAM-019","Camión minero 793F","Caterpillar 793F",12990,"Operativa"]];
const H=[["12/11/2026","Preventivo","Cambio de aceite hidráulico y filtros","L. Ccori","Filtro 7Y-1234 ×2"],["28/10/2026","Correctivo","Reparación de fuga en manguera de levante","M. Huamán","Manguera 4J-5521"],["05/10/2026","Preventivo","Inspección de frenos y neumáticos","L. Ccori","Pastillas de freno ×4"],["14/09/2026","Correctivo","Cambio de sensor de temperatura del motor","J. Rojas","Sensor 3E-6370"],["30/08/2026","Preventivo","Lubricación general y ajuste de pernos","M. Huamán","Grasa EP2 ×3 kg"]];
let A=[["Alta","EXC-007","Preventivo vencido (250 h)"],["Alta","PER-002","Falla reportada: sistema hidráulico"],["Media","CAM-012","Preventivo próximo en 18 h de uso"],["Media","TRA-003","Tarea atrasada: cambio de filtros"],["Baja","CAR-004","Revisión programada en 5 días"]];
let OT=[["OT-1041","EXC-007","Cambio de filtros y aceite","L. Ccori","Alta","En curso"],["OT-1042","PER-002","Diagnóstico sistema hidráulico","J. Rojas","Alta","Pendiente"],["OT-1043","CAM-012","Preventivo 500 h","M. Huamán","Media","Programada"],["OT-1044","TRA-003","Ajuste de tren de rodaje","M. Huamán","Baja","En curso"]];
const CAL=[["17 nov","EXC-007","Preventivo 250 h"],["19 nov","CAM-012","Preventivo 500 h"],["21 nov","CAR-004","Inspección de frenos"],["24 nov","TRA-003","Cambio de filtros"]];
const CK=["Nivel de aceite del motor","Estado de neumáticos / orugas","Sistema de frenos","Mangueras hidráulicas","Luces y alarmas","Temperatura y presión"];
const MODS={panel:"Panel",maq:"Maquinaria",reg:"Registro",his:"Historial",qr:"Códigos QR",ale:"Alertas",ot:"Órdenes",chk:"Checklists",rep:"Reportes"};
const P={panel:"M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z",maq:"M3 17h14M5 17v-5h6l2-4h4l2 4v5M7 20h.01M15 20h.01",reg:"M4 20h4L19 9l-4-4L4 16zM14 6l4 4",his:"M12 7v5l3 2M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4",qr:"M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3M20 14v7h-3",ale:"M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4",ot:"M7 4h10v17H7zM9 9h6M9 13h6M9 17h4",chk:"M4 6l2 2 3-3M4 14l2 2 3-3M12 7h8M12 15h8",rep:"M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"};
const R={tec:["Técnico","Luis Ccori",["panel","maq","reg","his","qr","chk","ot"]],sup:["Supervisor","Marco Quispe",Object.keys(MODS)],int:["Superintendencia","Ing. R. Salazar",["panel","maq","ale","rep"]]};
const S={q:"",dev:"android",v:"web",r:"sup",m:"panel",sel:0,tab:"ini",login:0,sc:0};const X={};
const LOGO=`<svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#C9A227"/><path d="M27 18a9 9 0 1 1-3-6.7" fill="none" stroke="#0B1B3A" stroke-width="3" stroke-linecap="round"/><path d="M26 6v6h-6" fill="none" stroke="#0B1B3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="18" r="3.5" fill="#0B1B3A"/></svg>`;
const BR=`<span class="mk">${LOGO}</span><span>Mantenimiento <b>360</b></span>`;
const ic=k=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[k]}"/></svg>`;
const st=s=>`<span class="bd ${s=="Operativa"?"ok":s=="Fuera de servicio"?"bad":"gd"}">${s}</span>`;
const pr=s=>`<span class="bd ${s=="Alta"?"bad":s=="Media"?"gd":"ok"}">${s}</span>`;
const head=(t,s)=>`<div><h2>${t}</h2><p class="sub">${s}</p></div>`;
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)};
let sel=(id)=>`<select id="${id}" onchange="S.sel=+this.value;render()">${M.map((m,i)=>`<option value="${i}" ${i==S.sel?"selected":""}>${m[0]} · ${m[1]}</option>`).join("")}</select>`;
let alerts=n=>A.slice(0,n).map(a=>`<div class="al"><span>${pr(a[0])} <b>${a[1]}</b></span><span>${a[2]}</span></div>`).join("");
const hl=i=>[...(X[M[i][0]]||[]),...[0,1,2].map(k=>H[(i+k)%5])].map(h=>`<div class="card"><b>${h[0]} · ${h[1]}</b><br>${h[2]}<br><small class="sub">Técnico: ${h[3]} · Repuestos: ${h[4]}</small></div>`);
const bars=()=>{const d=[[6,2],[8,3],[5,4],[9,2],[7,3],[10,2],[8,1],[11,3]];return `<svg viewBox="0 0 320 140" width="100%" role="img" aria-label="Mantenimientos preventivos y correctivos por semana"><g stroke="currentColor" opacity=".12">${[30,60,90,120].map(y=>`<line x1="8" x2="312" y1="${y}" y2="${y}"/>`).join("")}</g>`+d.map((x,i)=>`<rect style="fill:var(--bar)" x="${14+i*38}" y="${120-x[0]*9}" width="14" height="${x[0]*9}" rx="2"/><rect fill="#C9A227" x="${29+i*38}" y="${120-x[1]*9}" width="14" height="${x[1]*9}" rx="2"/><text x="${29+i*38}" y="136" font-size="10" text-anchor="middle" fill="currentColor">S${i+40}</text>`).join("")+`</svg>`};
const qr=c=>{let s=[...c].reduce((a,x)=>(a*31+x.charCodeAt(0))&0xffff,7),r="";const f=(x,y)=>[[0,0],[14,0],[0,14]].some(([a,b])=>x>=a&&x<a+7&&y>=b&&y<b+7);for(let y=0;y<21;y++)for(let x=0;x<21;x++){let on;if(f(x,y)){const dx=x-(x>13?14:0),dy=y-(y>13?14:0);on=dx==0||dy==0||dx==6||dy==6||(dx>1&&dx<5&&dy>1&&dy<5)}else{s=(s*1103515245+12345)&0x7fffffff;on=(s>>8)%3==0}if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="-1 -1 23 23" width="170" height="170" fill="#0B1B3A" style="background:#fff;border-radius:8px;padding:6px" role="img" aria-label="Código QR de ${c}">${r}</svg>`};
const donut=()=>{const d=FL();let o=0;const c=2*Math.PI*40;return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 100 100" width="140" height="140" role="img" aria-label="Estado de la flota: 19 operativas, 2 en mantenimiento, 3 fuera de servicio"><g transform="rotate(-90 50 50)" fill="none" stroke-width="14">${d.map(x=>{const l=x[0]/24*c,e=`<circle cx="50" cy="50" r="40" stroke="${x[1]}" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-o}"/>`;o+=l;return e}).join("")}</g><text x="50" y="52" text-anchor="middle" font-size="18" font-weight="800" fill="currentColor">24</text><text x="50" y="64" text-anchor="middle" font-size="7" fill="currentColor" opacity=".7">equipos</text></svg><div>${d.map(x=>`<div style="margin:4px 0"><span style="color:${x[1]}">●</span> ${x[2]} <b>${x[0]}</b></div>`).join("")}</div></div>`};
const chkList=()=>CK.map((t,i)=>`<div class="ckr"><span>${t}</span><select id="c${i}"><option>Conforme</option><option>Observación</option><option>Anomalía</option></select></div>`).join("");
let saveChk=()=>{const n=CK.filter((_,i)=>$("#c"+i).value=="Anomalía").length;toast(n?`Inspección guardada · ${n} anomalía(s) por reportar`:"Inspección guardada · sin anomalías")};
const otRows=()=>OT.map(o=>`<tr><td><b>${o[0]}</b></td><td>${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td><td>${pr(o[4])}</td><td>${o[5]}</td></tr>`).join("");
const saveReg=()=>{const c=M[+$("#rm").value][0],d=$("#rd").value.split("-").reverse().join("/");(X[c]=X[c]||[]).unshift([d,$("#rt").value,$("#rx").value||"Sin descripción",$("#rtc").value,"—"]);toast(`Registro guardado en el historial de ${c}`)};
const newOT=()=>{OT.unshift(["OT-"+(1045+OT.length-4),M[S.sel][0],"Inspección general",R[S.r][1],"Media","Programada"]);render();toast("Orden de trabajo creada")};
const F={
panel:()=>head("Panel de control",`Operación minera · Turno día · ${R[S.r][1]}`)+`<div class="kpis">`+[["Operativas",FL()[0][0],"ok","maq","de 24 equipos"],["Fuera de servicio",FL()[2][0],"bad","ale","requieren atención"],["Preventivos pendientes",5+OT.filter(o=>/Pend|Prog/.test(o[5])).length,"gd","reg","por ejecutar"],["OT activas",OT.filter(o=>o[5]!="Completada").length,"","ot","en ejecución"]].map(k=>`<div class="card kpi"><div class="kic">${ic(k[3])}</div><span>${k[0]}</span><b class="${k[2]}">${k[1]}</b><small class="sub">${k[4]}</small></div>`).join("")+`</div><div class="g2"><div class="card"><b>Actividades de mantenimiento por semana</b>${bars()}<small class="sub"><span style="color:var(--bar)">■</span> Preventivo &nbsp; <span style="color:var(--gold)">■</span> Correctivo</small></div><div class="card cal"><b>Próximos mantenimientos</b>${CAL.map(c=>`<div><span class="dt">${c[0]}</span><b>${c[1]}</b> ${c[2]}</div>`).join("")}</div></div><div class="g2"><div class="card"><b>Alertas de mantenimiento</b>${alerts(3)}</div><div class="card"><b>Estado de la flota</b>${donut()}</div></div>`,
maq:()=>head("Gestión de maquinaria","Muestra de la flota · clic en una fila para ver su historial")+`<div class="card tw"><table><tr><th>Código</th><th>Máquina</th><th>Marca y modelo</th><th>Horas</th><th>Estado</th></tr>${M.map((m,i)=>`<tr style="cursor:pointer" onclick="S.sel=${i};go('his')"><td><b>${m[0]}</b></td><td>${m[1]}</td><td>${m[2]}</td><td>${m[3].toLocaleString("es-PE")} h</td><td>${st(m[4])}</td></tr>`).join("")}</table></div>`,
reg:()=>head("Registro de mantenimiento","Registra las actividades realizadas")+`<div class="card f"><div><label>Máquina</label><select id="rm">${M.map((m,i)=>`<option value="${i}">${m[0]} · ${m[1]}</option>`).join("")}</select></div><div><label>Tipo</label><select id="rt"><option>Preventivo</option><option>Correctivo</option></select></div><div><label>Fecha de intervención</label><input id="rd" type="date" value="2026-11-16"></div><div><label>Técnico responsable</label><input id="rtc" value="${R[S.r][1]}"></div><div style="grid-column:1/-1"><label>Descripción y observaciones</label><textarea id="rx" rows="3" placeholder="Describe el trabajo realizado"></textarea></div><div><button class="btn g" onclick="saveReg()">Guardar registro</button></div></div>`,
his:()=>head("Historial de máquinas","Mantenimientos, fallas y repuestos por equipo")+`<div class="card">${sel("hs")}</div>`+hl(S.sel).join(""),
qr:()=>head("Códigos QR","Cada máquina tiene un código para acceder a su historial técnico")+`<div class="card">${sel("qs")}</div><div class="card qrw">${qr(M[S.sel][0])}<div><h3 style="margin:0">${M[S.sel][0]} · ${M[S.sel][1]}</h3><p class="sub">${M[S.sel][2]} · ${M[S.sel][3].toLocaleString("es-PE")} h</p>${st(M[S.sel][4])}<p>Al escanear: historial técnico, manuales y especificaciones.</p></div></div>`,
ale:()=>head("Alertas automáticas","Indicadores de prioridad por horas de uso, fechas y fallas")+`<div class="card">${alerts(5)}</div>`,
ot:()=>head("Órdenes de trabajo","Asignación de técnicos, fechas y prioridades")+`<div class="card tw"><table><tr><th>N.º</th><th>Máquina</th><th>Trabajo</th><th>Técnico</th><th>Prioridad</th><th>Estado</th></tr>${otRows()}</table></div><div><button class="btn g" onclick="newOT()">+ Nueva orden de trabajo</button></div>`,
chk:()=>head("Checklists digitales","Inspección de componentes y registro de anomalías")+`<div class="card">${sel("ks")}${chkList()}<p><button class="btn g" onclick="saveChk()">Guardar inspección</button></p></div>`,
rep:()=>head("Seguimiento y reportes","Avance de tareas e indicadores de mantenimiento")+`<div class="kpis">`+[["Cumplimiento preventivo","87%","ok","chk","meta: 90%"],["Tareas atrasadas","3","bad","ale","requieren atención"],["Actividades del mes","46","gd","rep","noviembre 2026"]].map(k=>`<div class="card kpi"><div class="kic">${ic(k[3])}</div><span>${k[0]}</span><b class="${k[2]}">${k[1]}</b><small class="sub">${k[4]}</small></div>`).join("")+`</div><div class="card"><b>Avance por técnico</b>${[["L. Ccori",8,10],["M. Huamán",6,9],["J. Rojas",4,7]].map(t=>`<div style="margin:12px 0"><div class="al" style="border:0;padding:0 0 4px"><span>${t[0]}</span><span>${t[1]}/${t[2]} tareas</span></div><div class="pb"><i style="width:${t[1]/t[2]*100}%"></i></div></div>`).join("")}</div>`};
const go=k=>{S.m=k;render()};
const setR=k=>{S.r=k;if(!R[k][2].includes(S.m))S.m="panel";render()};
const web=()=>`<div class="web"><nav><div class="user"><b>${R[S.r][1]}</b><br><small>${R[S.r][0]}</small></div>${R[S.r][2].map(k=>`<button class="${k==S.m?"on":""}" onclick="go('${k}')">${ic(k)}${MODS[k]}</button>`).join("")}</nav><div class="main"><div class="tbar"><div class="crumb">Mina · Taller central › <b>${MODS[S.m]}</b></div><div class="tools"><input aria-label="Buscar" value="${S.q}" oninput="S.q=this.value;$('.cont').innerHTML=F[S.m]()" placeholder="Buscar equipo u orden…"><span class="bell" aria-label="Notificaciones" onclick="bellGo()" style="cursor:pointer">${ic("ale")}<i class="n">${A.length}</i></span><span class="av">${R[S.r][1].split(" ").map(w=>w[0]).join("").slice(0,2)}</span></div></div><div class="cont">${F[S.m]()}</div></div></div>`;
let phone=(b,t)=>`<div class="ph"><div class="sb"><span>9:41</span><span>●●● 100%</span></div>${b}${t}</div>`;
let mob=()=>{if(!S.login)return phone(`<div class="scr login"><div class="lgm">${LOGO}</div><div class="brand lg" style="color:var(--ink)">Mantenimiento <b>360</b></div><p class="sub">Acceso para técnicos · Operación minera</p><input value="lccori@mina.pe" aria-label="Usuario"><input type="password" value="12345678" aria-label="Contraseña"><button class="btn g" onclick="S.login=1;render()">Ingresar</button></div>`,"");
const m=M[S.sel],T=[["ini","panel","Inicio"],["esc","qr","Escanear"],["ot","ot","Órdenes"],["chk","chk","Checklist"],["fal","ale","Fallas"]];
const B={ini:()=>`<h3>Hola, Luis</h3><b>Máquinas asignadas</b>`+M.slice(0,3).map((x,i)=>`<button class="card mc" onclick="S.sel=${i};S.sc=1;S.tab='esc';render()"><b>${x[0]}</b> · ${x[1]}<br>${st(x[4])}</button>`).join("")+`<b>Alertas</b>`+alerts(2),
esc:()=>S.sc?`<div class="card"><b>${m[0]} · ${m[1]}</b><br><small class="sub">${m[2]} · ${m[3].toLocaleString("es-PE")} h</small><div>${st(m[4])}</div></div><b>Últimos mantenimientos</b>${hl(S.sel).slice(0,2).join("")}<button class="btn" onclick="S.sc=0;render()">Escanear otro código</button>`:`<h3>Escanear código QR</h3><div class="scan">Apunta la cámara al código QR de la máquina</div><button class="btn g" onclick="S.sc=1;render()">Escanear QR</button>`,
ot:()=>`<h3>Mis órdenes de trabajo</h3>`+OT.map(o=>`<div class="card"><b>${o[0]} · ${o[1]}</b><br>${o[2]}<br>${pr(o[4])} <span class="bd">${o[5]}</span></div>`).join(""),
chk:()=>`<h3>Checklist de inspección</h3>${sel("ks")}${chkList()}<button class="btn g" onclick="saveChk()">Guardar inspección</button>`,
fal:()=>`<h3>Reportar falla</h3>${sel("fs")}<textarea rows="5" placeholder="Describe la falla observada"></textarea><button class="btn g" onclick="toast('Falla reportada al supervisor')">Enviar reporte</button>`};
return phone(`<div class="scr">${B[S.tab]()}</div>`,`<div class="tb">${T.map(t=>`<button class="${S.tab==t[0]?"on":""}" onclick="S.tab='${t[0]}';render()">${ic(t[1])}${t[2]}</button>`).join("")}</div>`)};
function render(){$("#top").innerHTML=`<div class="brand">${BR}</div><div class="seg">${[["web","Plataforma web"],["mob","App móvil"]].map(([k,t])=>`<button class="${S.v==k?"on":""}" onclick="S.v='${k}';render()">${t}</button>`).join("")}</div>`+(S.v=="web"?`<div class="seg">${Object.entries(R).map(([k,r])=>`<button class="${S.r==k?"on":""}" onclick="setR('${k}')">${r[0]}</button>`).join("")}</div>`:`<div class="seg">${[["android","Android"],["ios","iPhone"],["tab","Tablet"]].map(([k,t])=>`<button class="${S.dev==k?"on":""}" onclick="S.dev='${k}';render()">${t}</button>`).join("")}</div>`);$("#app").innerHTML=S.v=="web"?web():mob()}
OT.push(["OT-1039","CAR-004","Inspección de frenos","M. Huamán","Media","Completada"],["OT-1040","CAM-019","Cambio de neumático","J. Rojas","Baja","Completada"]);
let nOT=1045;const TEC=["L. Ccori","M. Huamán","J. Rojas"],HOY="16/11/2026";
const mq=c=>M.find(m=>m[0]==c),flt=a=>a.filter(r=>r.join(" ").toLowerCase().includes(S.q.toLowerCase()));
const FL=()=>{const c=s=>M.filter(m=>m[4]==s).length;return [[15+c("Operativa"),"var(--ok)","Operativas"],[1+c("En mantenimiento"),"#C9A227","En mantenimiento"],[2+c("Fuera de servicio"),"var(--bad)","Fuera de servicio"]]};
const mkOT=(c,d,p,t)=>{OT.unshift(["OT-"+nOT,c,d,t||TEC[nOT%3],p,"Pendiente"]);nOT++},addA=(p,c,t)=>{A.unshift([p,c,t])};
const modal=h=>{const d=document.createElement("div");d.className="ov";d.innerHTML=`<div class="card" style="max-width:560px;width:100%;max-height:85vh;overflow:auto">${h}<p><button class="btn g" onclick="this.closest('.ov').remove()">Cerrar</button></p></div>`;document.body.append(d)};
const bellGo=()=>R[S.r][2].includes("ale")?go("ale"):toast(`${A.length} alertas activas`);
function otAct(id){const o=OT.find(x=>x[0]==id),m=mq(o[1]);if(o[5]=="En curso"){o[5]="Completada";if(m)m[4]="Operativa";(X[o[1]]=X[o[1]]||[]).unshift([HOY,o[4]=="Alta"?"Correctivo":"Preventivo",o[2],o[3],"—"]);A=A.filter(a=>a[1]!=o[1]);toast(`${id} completada · ${o[1]} operativa`)}else{o[5]="En curso";if(m)m[4]="En mantenimiento";toast(`${id} iniciada`)}render()}
alerts=(n,act)=>A.slice(0,n).map((a,i)=>`<div class="al"><span>${pr(a[0])} <b>${a[1]}</b> ${a[2]}</span>${act?`<span><button class="btn" onclick="alOT(${i})">Crear OT</button> <button class="btn g" onclick="alOK(${i})">Resolver</button></span>`:""}</div>`).join("")||`<p class="sub">Sin alertas activas</p>`;
const alOT=i=>{const a=A[i];mkOT(a[1],a[2],a[0]=="Baja"?"Media":a[0]);A.splice(i,1);toast("Orden de trabajo creada desde la alerta");render()},alOK=i=>{A.splice(i,1);toast("Alerta resuelta");render()};
sel=(id,nr)=>`<select id="${id}" onchange="S.sel=+this.value${nr?"":";render()"}">${M.map((m,i)=>`<option value="${i}" ${i==S.sel?"selected":""}>${m[0]} · ${m[1]}</option>`).join("")}</select>`;
saveChk=()=>{const c=M[S.sel][0],v=i=>$("#c"+i).value,bad=CK.filter((_,i)=>v(i)=="Anomalía"),obs=CK.filter((_,i)=>v(i)=="Observación");if(bad.length){addA("Alta",c,"Anomalía en inspección: "+bad.join(", "));mkOT(c,"Corregir: "+bad.join(", "),"Alta");M[S.sel][4]="Fuera de servicio"}else if(obs.length)addA("Media",c,"Observación en inspección: "+obs.join(", "));(X[c]=X[c]||[]).unshift([HOY,"Preventivo","Inspección (checklist): "+(bad.length+obs.length?bad.concat(obs).join(", "):"sin novedades"),R[S.r][1],"—"]);toast(bad.length?`Inspección guardada · alerta y OT generadas para ${c}`:"Inspección guardada");render()};
F.maq=()=>head("Gestión de maquinaria","Clic en una fila para ver su historial · usa el buscador superior")+`<div class="card tw"><table><tr><th>Código</th><th>Máquina</th><th>Marca y modelo</th><th>Horas</th><th>Estado</th></tr>${M.map((m,i)=>[m,i]).filter(([m])=>m.join(" ").toLowerCase().includes(S.q.toLowerCase())).map(([m,i])=>`<tr style="cursor:pointer" onclick="S.sel=${i};go('his')"><td><b>${m[0]}</b></td><td>${m[1]}</td><td>${m[2]}</td><td>${m[3].toLocaleString("es-PE")} h</td><td>${st(m[4])}</td></tr>`).join("")}</table></div>`;
const otBtn=o=>o[5]=="Completada"?"✔":`<button class="btn ${o[5]=="En curso"?"g":""}" onclick="otAct('${o[0]}')">${o[5]=="En curso"?"Finalizar":"Iniciar"}</button>`;
F.ot=()=>head("Órdenes de trabajo","Crea, inicia y finaliza órdenes: el estado de la máquina y el historial se actualizan")+`<div class="card f"><div><label>Máquina</label>${sel("os",1)}</div><div><label>Trabajo</label><input id="od" placeholder="Ej. Cambio de filtros"></div><div><label>Prioridad</label><select id="op"><option>Alta</option><option selected>Media</option><option>Baja</option></select></div><div><label>Técnico</label><select id="ot2">${TEC.map(t=>`<option>${t}</option>`).join("")}</select></div><div><button class="btn g" onclick="mkOT(M[S.sel][0],$('#od').value||'Mantenimiento general',$('#op').value,$('#ot2').value);toast('Orden de trabajo creada');render()">+ Crear orden</button></div></div><div class="card tw"><table><tr><th>N.º</th><th>Máquina</th><th>Trabajo</th><th>Técnico</th><th>Prioridad</th><th>Estado</th><th></th></tr>${flt(OT).map(o=>`<tr><td><b>${o[0]}</b></td><td>${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td><td>${pr(o[4])}</td><td><span class="bd">${o[5]}</span></td><td>${otBtn(o)}</td></tr>`).join("")}</table></div>`;
F.ale=()=>head("Alertas automáticas","Genera una orden de trabajo o resuelve cada alerta")+`<div class="card">${alerts(A.length,1)}</div>`;
const qrOld=F.qr;F.qr=()=>qrOld()+`<div><button class="btn g" onclick="scanW()">Simular escaneo con el celular</button></div>`;
const scanW=()=>{S.sel=Math.random()*M.length|0;const m=M[S.sel];render();modal(`<h3 style="margin-top:0">Código detectado: ${m[0]}</h3><p>${m[1]} · ${m[2]}<br>${m[3].toLocaleString("es-PE")} h · ${st(m[4])}</p>${hl(S.sel).slice(0,2).join("")}`)};
F.rep=()=>{const dn=OT.filter(o=>o[5]=="Completada").length,tc=[...new Set(OT.map(o=>o[3]))];return head("Seguimiento y reportes","Indicadores calculados con las órdenes y registros del sistema")+`<div class="kpis">`+[["Cumplimiento de OT",Math.round(dn/OT.length*100)+"%","ok","chk","completadas / total"],["Alertas activas",A.length,"bad","ale","por atender"],["Actividades del mes",42+dn+Object.values(X).flat().length,"gd","rep","noviembre 2026"]].map(k=>`<div class="card kpi"><div class="kic">${ic(k[3])}</div><span>${k[0]}</span><b class="${k[2]}">${k[1]}</b><small class="sub">${k[4]}</small></div>`).join("")+`</div><div class="card"><b>Avance por técnico</b>${tc.map(t=>{const a=OT.filter(o=>o[3]==t),d=a.filter(o=>o[5]=="Completada").length;return `<div style="margin:12px 0"><div class="al" style="border:0;padding:0 0 4px"><span>${t}</span><span>${d}/${a.length} órdenes</span></div><div class="pb"><i style="width:${d/a.length*100}%"></i></div></div>`}).join("")}</div><div><button class="btn g" onclick="genRep()">Generar reporte de actividades</button></div>`};
const genRep=()=>modal(`<h3 style="margin-top:0">Reporte de actividades · ${HOY}</h3>`+OT.filter(o=>o[5]=="Completada").map(o=>`<div class="al"><span><b>${o[0]}</b> ${o[1]} · ${o[2]}</span><span>${o[3]}</span></div>`).join("")+`<p class="sub">Órdenes abiertas: ${OT.filter(o=>o[5]!="Completada").length} · Alertas activas: ${A.length}</p>`);
const scanM=()=>{$(".scan").textContent="Escaneando…";setTimeout(()=>{S.sel=Math.random()*M.length|0;S.sc=1;render()},900)};
const quickReg=()=>{const c=M[S.sel][0];(X[c]=X[c]||[]).unshift([HOY,"Preventivo","Mantenimiento registrado desde la app","Luis Ccori","—"]);toast("Mantenimiento registrado en el historial");render()};
const faltaM=()=>{const t=$("#ft").value.trim();if(!t)return toast("Describe la falla antes de enviar");const c=M[S.sel][0];addA("Alta",c,"Falla reportada: "+t);mkOT(c,"Diagnóstico: "+t,"Alta");M[S.sel][4]="Fuera de servicio";toast("Falla reportada al supervisor · OT creada");S.tab="ot";render()};
const loginM=()=>{if(!$("#lu").value||!$("#lp").value)return toast("Ingresa usuario y contraseña");S.login=1;render()};
phone=(b,t)=>`<div class="ph ${S.dev}"><div class="sb"><span>9:41</span>${S.dev=="ios"?'<span class="nt"></span>':""}<span>${S.dev=="android"?"▲ ":""}100%</span></div>${b}${t}</div><p class="cap">${{android:"Android 14 · pantalla 6.5″",ios:"iOS 17 · pantalla 6.1″",tab:"Tablet Android · pantalla 10″"}[S.dev]}</p>`;
mob=()=>{if(!S.login)return phone(`<div class="scr login"><div class="lgm">${LOGO}</div><div class="brand lg" style="color:var(--ink)">Mantenimiento <b>360</b></div><p class="sub">Acceso para técnicos · Operación minera</p><input id="lu" value="lccori@mina.pe" aria-label="Usuario"><input id="lp" type="password" value="12345678" aria-label="Contraseña"><button class="btn g" onclick="loginM()">Ingresar</button></div>`,"");
const m=M[S.sel],T=[["ini","panel","Inicio"],["esc","qr","Escanear"],["ot","ot","Órdenes"],["chk","chk","Checklist"],["fal","ale","Fallas"]];
const B={ini:()=>`<h3>Hola, Luis</h3><b>Máquinas asignadas</b>`+M.slice(0,3).map((x,i)=>`<button class="card mc" onclick="S.sel=${i};S.sc=1;S.tab='esc';render()"><b>${x[0]}</b> · ${x[1]}<br>${st(x[4])}</button>`).join("")+`<b>Alertas</b>${alerts(3)}<button class="btn" onclick="S.login=0;render()">Cerrar sesión</button>`,
esc:()=>S.sc?`<div class="card"><b>${m[0]} · ${m[1]}</b><br><small class="sub">${m[2]} · ${m[3].toLocaleString("es-PE")} h</small><div>${st(m[4])}</div></div><b>Últimos mantenimientos</b>${hl(S.sel).slice(0,2).join("")}<button class="btn g" onclick="quickReg()">Registrar mantenimiento</button><button class="btn" onclick="S.sc=0;render()">Escanear otro código</button>`:`<h3>Escanear código QR</h3><div class="scan">Apunta la cámara al código QR de la máquina</div><button class="btn g" onclick="scanM()">Escanear QR</button>`,
ot:()=>`<h3>Órdenes de la guardia</h3>`+OT.map(o=>`<div class="card"><b>${o[0]} · ${o[1]}</b><br>${o[2]}<br>${pr(o[4])} <span class="bd">${o[5]}</span><p style="margin:8px 0 0">${otBtn(o)}</p></div>`).join(""),
chk:()=>`<h3>Checklist de inspección</h3>${sel("ks")}${chkList()}<button class="btn g" onclick="saveChk()">Guardar inspección</button>`,
fal:()=>`<h3>Reportar falla</h3>${sel("fs",1)}<textarea id="ft" rows="5" placeholder="Describe la falla observada"></textarea><button class="btn g" onclick="faltaM()">Enviar reporte</button>`};
return phone(`<div class="scr">${B[S.tab]()}</div>`,`<div class="tb">${T.map(t=>`<button class="${S.tab==t[0]?"on":""}" onclick="S.tab='${t[0]}';render()">${ic(t[1])}${t[2]}</button>`).join("")}</div>`)};
render();
</script></body></html>
